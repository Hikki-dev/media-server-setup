<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mss-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide - Media Server Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23f0a53a%27/%3E%3Cpath d=%27M12 9l11 7-11 7z%27 fill=%27%232a1a02%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  .guide{display:flex;min-height:100vh}
  .guide nav{flex:0 0 272px;padding:28px 22px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;box-sizing:border-box}
  .guide nav a{display:block;padding:9px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500;margin:2px 0}
  .guide nav a:hover{background:var(--panel);color:var(--text)}
  .guide nav a.on{background:var(--panel);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
  .guide nav .back,.guide nav .sidelink{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);font-weight:600;margin:18px 0 0}
  .guide nav .back svg.i{color:var(--accent-text);width:19px;height:19px}
  .guide nav .sidelink{margin:10px 0 0}
  .guide nav .back:hover{border-color:var(--accent);background:var(--panel2)}
  .guide main{flex:1;min-width:0;padding:48px 56px 96px;max-width:1160px}
  .doc p,.doc li,.doc blockquote{max-width:80ch}
  .doc h1{font:600 38px/1.15 var(--display,var(--sans));margin:0 0 18px}
  .doc h2{font:600 24px/1.25 var(--display,var(--sans));margin:44px 0 12px;padding-top:8px;border-top:1px solid var(--line)}
  .doc h3{font:600 18px/1.3 var(--sans);margin:28px 0 8px}
  .doc p,.doc li{color:var(--text);line-height:1.7}
  .doc li{margin:5px 0}
  .doc a{color:var(--accent-text2)}
  .doc code{font:13.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .doc pre{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto}
  .doc pre code{background:none;border:0;padding:0;font-size:13px}
  .doc table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14.5px}
  .doc th,.doc td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
  .doc th{background:var(--panel);color:var(--mute);font-weight:600}
  .doc a.pic{display:block}
  .doc a.pic img{cursor:zoom-in}
  .doc img{max-width:100%;border:1px solid var(--line);border-radius:12px;margin:12px 0;display:block}
  .doc blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
  .doc hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  @media (max-width:820px){.guide{flex-direction:column}.guide nav{position:static;height:auto;flex:none;border-right:0;border-bottom:1px solid var(--line)}.guide main{padding:28px 20px 64px}}
</style>
</head>
<body>
<div class="guide">
  <nav id="nav" aria-label="Guide pages"></nav>
  <main><article class="doc" id="doc"><p>Loading the guide…</p></article></main>
</div>
<script src="guide.js"></script>
</body>
</html>
